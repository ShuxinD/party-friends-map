const data=demo
let persons=[],edges=[],coupleEdges=[],pos={},sizes={},selected=null;
const genders={男:'#3169af',女:'#cb568d',其他:'#33434b'};
function parse(d){
  const ps=d.people.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{
    const fields=s.split('|').map(x=>x.trim());let name,gender,attendance,intro;
    if(fields.length===3){ // Older saved diagrams used name | group | intro.
      [name,,intro]=fields;gender='其他';attendance='到场';
    }else if(fields.length===4){
      [name,gender,attendance,intro]=fields;
      if(!['男','女','其他'].includes(gender))throw Error(`第 ${i+1} 行的性别请填男、女或其他`);
      if(!['到场','未到场'].includes(attendance))throw Error(`第 ${i+1} 行请填到场或未到场`);
    }else throw Error(`第 ${i+1} 行请按「名字 | 性别 | 到场情况 | 简介」填写`);
    if(!name)throw Error(`第 ${i+1} 行没有名字`);
    return{name,gender,attendance,intro:intro||'还没有填写简介'};
  });
  if(ps.length<2||ps.length>35)throw Error('请填写 2–35 位朋友');
  const names=new Set(ps.map(p=>p.name));if(names.size!==ps.length)throw Error('名字不能重复');
  function parsePairs(value,label){
    const pairs=[],seen=new Set();
    for(const line of (value||'').split('\n').map(x=>x.trim()).filter(Boolean)){
      const pair=line.split(/\s+-\s+/);
      if(pair.length!==2||!names.has(pair[0])||!names.has(pair[1]))throw Error(`${label}的名字或格式有误：${line}`);
      if(pair[0]===pair[1])continue;
      const id=[...pair].sort().join('~');if(!seen.has(id)){seen.add(id);pairs.push(pair)}
    }
    return pairs;
  }
  const cs=parsePairs(d.couples,'Couple');
  const coupleIds=new Set(cs.map(pair=>[...pair].sort().join('~')));
  const ls=parsePairs(d.relations,'认识关系').filter(pair=>!coupleIds.has([...pair].sort().join('~')));
  return{ps,ls,cs};
}
function make(tag,attrs){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function nodeSize(p){
  const absent=p.attendance==='未到场',font=absent?11:12;
  const context=document.createElement('canvas').getContext('2d');
  context.font=`600 ${font}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
  return{width:Math.max(absent?34:52,Math.ceil(context.measureText(p.name).width)+(absent?12:20)),height:absent?25:33,font};
}
function layout(){
  pos={};sizes={};const n=persons.length;
  persons.forEach(p=>sizes[p.name]=nodeSize(p));
  persons.forEach((p,i)=>{const angle=-Math.PI/2+2*Math.PI*i/n,r=n>17?208:179;pos[p.name]={x:220+r*Math.cos(angle),y:305+r*1.35*Math.sin(angle)}});
  for(let t=0;t<250;t++){
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const a=pos[persons[i].name],b=pos[persons[j].name],sa=sizes[persons[i].name],sb=sizes[persons[j].name];
      const dx=b.x-a.x,dy=b.y-a.y,ox=Math.max(0,(sa.width+sb.width)/2+8-Math.abs(dx)),oy=Math.max(0,(sa.height+sb.height)/2+9-Math.abs(dy));
      if(ox&&oy){if(ox<oy){const s=dx>=0?1:-1;a.x-=s*ox*.52;b.x+=s*ox*.52}else{const s=dy>=0?1:-1;a.y-=s*oy*.52;b.y+=s*oy*.52}}
    }
    persons.forEach(p=>{const a=pos[p.name],d=sizes[p.name];a.x=Math.max(d.width/2+8,Math.min(432-d.width/2,a.x));a.y=Math.max(d.height/2+8,Math.min(584-d.height/2,a.y))});
  }
}
function updateLines(){document.querySelectorAll('.edge').forEach((e,i)=>{const[a,b]=edges[i]||coupleEdges[i-edges.length];e.setAttribute('x1',pos[a].x);e.setAttribute('y1',pos[a].y);e.setAttribute('x2',pos[b].x);e.setAttribute('y2',pos[b].y)});document.querySelectorAll('.heart').forEach((e,i)=>{const[a,b]=coupleEdges[i];e.setAttribute('x',(pos[a].x+pos[b].x)/2);e.setAttribute('y',(pos[a].y+pos[b].y)/2)})}
function render(){
  const map=$('map');map.replaceChildren();$('legend').replaceChildren();
  [['#3169af','男生'],['#cb568d','女生'],['#9ba4a6','灰色：未到场'],['#e35f96','♥ Couple']].forEach(([color,label])=>{const s=document.createElement('span'),i=document.createElement('i');i.style.background=color;s.append(i,document.createTextNode(label));$('legend').append(s)});
  edges.forEach(([a,b])=>map.append(make('line',{class:'edge'+(selected?(a===selected||b===selected?' active':' dim'):''),x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y})));
  coupleEdges.forEach(([a,b])=>{const dim=selected&&a!==selected&&b!==selected;map.append(make('line',{class:'edge couple-line'+(dim?' dim':''),x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y}));const h=make('text',{class:'heart'+(dim?' dim':''),x:(pos[a].x+pos[b].x)/2,y:(pos[a].y+pos[b].y)/2});h.textContent='♥';map.append(h)});
  persons.forEach(p=>{
    const q=pos[p.name],related=[...edges,...coupleEdges].some(([a,b])=>a===selected&&b===p.name||b===selected&&a===p.name);
    const g=make('g',{class:'node'+(p.attendance==='未到场'?' absent':'')+(selected===p.name?' active':selected&&!related?' dim':''),transform:`translate(${q.x} ${q.y})`});
    const d=sizes[p.name];
    g.append(make('rect',{x:-d.width/2,y:-d.height/2,width:d.width,height:d.height,rx:d.height/2}));
    const label=make('text',{x:0,y:1,fill:genders[p.gender],'font-size':d.font});label.textContent=p.name;g.append(label);
    let start,moved=false;
    g.onpointerdown=e=>{start={x:e.clientX,y:e.clientY,px:q.x,py:q.y};moved=false;if(e.pointerType!=='touch')g.setPointerCapture(e.pointerId)};
    g.onpointermove=e=>{if(!start||e.pointerType==='touch')return;const box=map.getBoundingClientRect(),dx=(e.clientX-start.x)*440/box.width,dy=(e.clientY-start.y)*620/box.height;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;if(moved){q.x=Math.max(d.width/2+8,Math.min(432-d.width/2,start.px+dx));q.y=Math.max(d.height/2+8,Math.min(584-d.height/2,start.py+dy));g.setAttribute('transform',`translate(${q.x} ${q.y})`);updateLines()}};
    g.onpointerup=()=>{if(start&&!moved)show(p.name);start=null;if(moved)render()};g.onpointercancel=()=>{start=null};map.append(g);
  });

function show(name){
  selected=name;render();const p=persons.find(x=>x.name===name);
  $('name').textContent=p.name;$('name').style.color=genders[p.gender];$('group').textContent=p.attendance==='未到场'?'未到场的共同好友':'到场';$('group').style.color=p.attendance==='未到场'?'#6d787b':'#315f69';$('intro').textContent=p.intro;
  const known=edges.flatMap(([a,b])=>a===name?[b]:b===name?[a]:[]),partners=coupleEdges.flatMap(([a,b])=>a===name?[b]:b===name?[a]:[]);$('known').replaceChildren();if(!known.length&&!partners.length)$('known').textContent='暂无已标注的关系';
  partners.forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent='♥ '+n;$('known').append(c)});known.forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent=n;$('known').append(c)});
  $('veil').classList.add('open');$('detail').classList.add('open');

function close(){$('veil').classList.remove('open');$('detail').classList.remove('open')}
function renderDirectory(){
  const rows=$('introRows');rows.replaceChildren();
  const attending=persons.filter(p=>p.attendance==='到场').length;
  $('directoryCount').textContent=`到场的朋友 · ${attending} 位`;
  persons.filter(p=>p.attendance==='到场').forEach(p=>{
    const tr=document.createElement('tr');
    const nameCell=document.createElement('td'),name=document.createElement('strong');
    name.textContent=p.name;name.style.color=genders[p.gender];nameCell.append(name);
    const introCell=document.createElement('td');introCell.textContent=p.intro==='还没有填写简介'?'—':p.intro;
    tr.append(nameCell,introCell);rows.append(tr);
  });
}
let mapZoom=1.25;
const mobileMap=window.matchMedia('(max-width:600px)');
function setMapZoom(value,center=false){
  const box=document.querySelector('.mapbox'),map=$('map');
  if(!mobileMap.matches){map.style.width='';map.style.height='';return}
  const previousWidth=map.getBoundingClientRect().width||440*mapZoom;
  const previousHeight=map.getBoundingClientRect().height||620*mapZoom;
  const focusX=center ? 0.5 :(box.scrollLeft+box.clientWidth/2)/previousWidth;
  const focusY=center ? 0.5 :(box.scrollTop+box.clientHeight/2)/previousHeight;
  mapZoom=Math.max(.6,Math.min(2.4,value));
  map.style.width=`${440*mapZoom}px`;map.style.height=`${620*mapZoom}px`;
  requestAnimationFrame(()=>{
    box.scrollLeft=Math.max(0,440*mapZoom*focusX-box.clientWidth/2);
    box.scrollTop=Math.max(0,620*mapZoom*focusY-box.clientHeight/2);
  });
}
function load(){const p=parse(data);persons=p.ps;edges=p.ls;coupleEdges=p.cs;layout();render();renderDirectory();setMapZoom(mapZoom,true)}

$('zoomOut').onclick=()=>setMapZoom(mapZoom-.25);
$('fitMap').onclick=()=>{const box=document.querySelector('.mapbox');setMapZoom(Math.min(box.clientWidth/440,box.clientHeight/620),true)};
